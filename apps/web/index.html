<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#150a2e" />
    <title>OpenFrame</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/logo-mark-32.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo-mark-180.png" />
    <!--
      The splash lives HERE, not in a React component, and the reason is
      structural: `main.tsx` opens with a top-level `await createRuntime()`, so
      `#root` is empty until IndexedDB answers. A React splash cannot paint
      during the wait it exists to cover — React is most of that wait.

      The colours below are literals because a stylesheet has not loaded yet at
      first paint. `app/brand-splash.test.ts` asserts they equal the
      `--of-brand-*` tokens in styles.css, so there is still one source of truth.

      The backdrop is a 146-byte inlined thumbnail of the artwork, so the first
      frame is already the right image, blurred. The full picture fades in over
      it if it arrives first; if the board is ready sooner, it never appears and
      is never waited for. A loading screen that delays loading is a joke at the
      user's expense.
    -->
    <!--
      Once per session. The artwork is the one full-bleed brand moment and it
      holds for two seconds, which on a warm load IS the loading time — paid
      again for every board opened from the front door, because each is a full
      page load. So a tab that has already seen it gets a quiet sheet in the
      person's own world instead, gone the moment the page is ready.

      Decided here, before the body is parsed, so the first frame is already
      the right one. `splash.ts` sets the flag when the artwork leaves, and
      reads this attribute rather than asking storage a second time.
    -->
    <script>
      try {
        if (sessionStorage.getItem('openframe:splash-seen') === 'yes') {
          var night = localStorage.getItem('openframe:theme') === 'after-hours'
          document.documentElement.dataset.splash = 'quiet'
          if (night) document.documentElement.dataset.splashWorld = 'after-hours'
          // The browser's chrome matches the sheet from the first frame; the
          // same two page colours the quiet sheet's CSS uses, pinned alike.
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', night ? '#1b1033' : '#f7f9fb')
        }
      } catch (error) {
        // Storage refused: the artwork every time is the safe answer.
      }
    </script>
    <style>
      #of-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background-color: #150a2e;
        background-image: url('data:image/webp;base64,UklGRo4AAABXRUJQVlA4IIIAAAAwBQCdASoYABIAPu1kqE2ppaOiMBgMATAdiWoAnTLdfKghXssFItj6UHAZumzur+O/gAD+5ZBLROkoLMV5aN0H4uyjF99t/C/sWl2sp1YHh2Gazof1flbww1S/yfDhNrGkednUzoyev4lTPfHoN+21k02H6RCI+iB/zwaKH3IqEAAA');
        background-size: cover;
        background-position: center;
        transition: opacity 220ms ease-out;
      }
      #of-splash[data-state='leaving'] {
        opacity: 0;
        pointer-events: none;
      }
      #of-splash img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 320ms ease-out;
      }
      #of-splash img[data-loaded='true'] {
        opacity: 1;
      }
      /*
       * The artwork is 4:3 and its lettering runs from 7% to 93% of the width,
       * so `cover` starts slicing the wordmark off below roughly 8/7 — which is
       * every phone held upright. Letterbox instead of decapitating the logo;
       * the void behind it is the same colour the artwork fades to anyway.
       */
      @media (max-aspect-ratio: 8 / 7) {
        #of-splash img {
          object-fit: contain;
        }
        /*
         * And drop the blurred backdrop with it. Stretched to cover a portrait
         * viewport it puts the artwork's brightest band — the magenta sky —
         * above and below the picture, which fights the thing it is framing.
         * The void is what the artwork fades to at its own edges anyway.
         */
        #of-splash {
          background-image: none;
        }
      }
      #of-splash p {
        position: relative;
        grid-area: 1 / 1;
        align-self: end;
        margin: 0 0 max(32px, env(safe-area-inset-bottom));
        padding: 7px 14px;
        /* The product's control radius, not a capsule: round means grab me. */
        border-radius: 6px;
        background: rgb(21 10 46 / 82%);
        color: #ece8fb;
        font: 13px/1.3 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.01em;
      }
      /*
       * Under the picture on a phone held upright, rather than at the foot of
       * the void: letterboxed at 4:3, it ends half the height plus
       * three-eighths of the width down. After the rule above, which it
       * overrides.
       */
      @media (max-aspect-ratio: 8 / 7) {
        #of-splash p {
          align-self: start;
          margin: calc(50vh + 37.5vw + 16px) 0 0;
        }
      }
      /*
       * The watchdog's way out. Brand colours only, like everything else here:
       * the stylesheet may be the very thing that never arrived.
       */
      #of-splash button {
        position: relative;
        align-self: end;
        grid-area: 1 / 1;
        min-height: 30px;
        margin: 0 0 max(32px, env(safe-area-inset-bottom));
        padding: 0 16px;
        border: 1px solid #ece8fb;
        border-radius: 6px;
        background: #150a2e;
        color: #ece8fb;
        font: 13px/1.3 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        cursor: pointer;
      }
      /* Stalled: the label steps up to make room for the button under it. */
      #of-splash[data-state='stalled'] p {
        margin-bottom: calc(max(32px, env(safe-area-inset-bottom)) + 42px);
      }
      #of-splash button:focus-visible {
        outline: 2px solid #ece8fb;
        outline-offset: 2px;
      }
      /*
       * The quiet sheet: the world's own page colour and nothing on it, so the
       * handover is from the page to the page. The label comes back only if
       * the watchdog has something to say.
       */
      [data-splash='quiet'] #of-splash {
        background-color: #f7f9fb;
        background-image: none;
      }
      [data-splash='quiet'][data-splash-world='after-hours'] #of-splash {
        background-color: #1b1033;
      }
      [data-splash='quiet'] #of-splash:not([data-state='stalled']) > * {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #of-splash,
        #of-splash img {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      No `role="status"` on the container. The toast is the application's status
      region, and a second one is a real problem rather than a test-only
      collision: two live regions competing to speak. Content that is already
      present at load is not announced by a live region anyway, so the role was
      buying nothing here.

      The LABEL keeps `aria-live`, because the one thing worth announcing is the
      one thing that changes — the watchdog below replacing it when opening runs
      long. A board that cannot open takes the splash away instead
      (`abandonSplash`), for a panel of its own.
    -->
    <div id="of-splash">
      <!--
        Two widths, because this image is `object-fit: cover` over the WHOLE
        viewport: 1448px covers a 1x laptop and is visibly soft on anything
        retina, which is what it looked like. `sizes="100vw"` is the honest
        declaration — the browser then picks by device pixel ratio, so a 1x
        screen still pays 67KB and only a 2x screen pays 164KB.

        Vite rewrites `srcset` in HTML the same way it rewrites `src`, so both
        files are hashed and bundled; `brand-splash.test.ts` asserts every path
        named in EITHER attribute exists.
      -->
      <img
        src="/src/assets/splash-hero.webp"
        srcset="/src/assets/splash-hero.webp 1448w, /src/assets/splash-hero-2x.webp 2896w"
        sizes="100vw"
        alt=""
        decoding="async"
        fetchpriority="high"
        onload="this.dataset.loaded = 'true'"
      />
      <p aria-live="polite">Opening OpenFrame</p>
      <!--
        Says what is actually opening, before the first frame. The markup's own
        words are the neutral ones, so a page where this never ran is still
        telling the truth. Mirrors `app/route.ts`: `board` and `room` are the
        two parameters that open a board, and anything else is the front door.
      -->
      <script>
        if (/[?&](board|room)=/.test(location.search)) {
          document.currentScript.previousElementSibling.textContent = 'Opening the board'
        }
      </script>
    </div>
    <!--
      The watchdog. Inline, and before the module graph, because the case it
      exists for is the one where the application never arrives: an entry
      module the network dropped, or a start-up that stalled rather than
      failed. A splash over an inert root that never goes is a page that cannot
      be used and does not say so. After twelve seconds it admits it, in the
      live label, and offers the one thing that helps.
    -->
    <script>
      setTimeout(function () {
        var splash = document.getElementById('of-splash')
        if (splash === null) return
        splash.querySelector('p').textContent =
          'Still opening. This is taking longer than usual.'
        var reload = document.createElement('button')
        reload.type = 'button'
        reload.textContent = 'Reload'
        reload.onclick = function () {
          location.reload()
        }
        splash.dataset.state = 'stalled'
        splash.appendChild(reload)
      }, 12000)
    </script>
    <!--
      `inert` until the splash goes. The splash covers the board and swallows
      the mouse, but focus is not blocked by a sheet on top of it — without
      this, two seconds is long enough to Tab into a toolbar nobody can see.
      `splash.ts` lifts it.
    -->
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
