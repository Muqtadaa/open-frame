name = "openframe-rooms"
main = "src/index.ts"
# Pinned, not "latest". The runtime's behaviour is versioned by this date, so a
# deploy six months from now runs the runtime this code was written against.
compatibility_date = "2026-09-18"

# The Worker's name is its DNS label: <name>.<your-subdomain>.workers.dev.
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BoardRoomObject"

# The declarative form, which replaced the imperative `migrations` array in
# July 2026. The two are mutually exclusive, and `migrations` is now legacy.
#
# `storage = "sqlite"` is not a preference: new key-value backed namespaces can
# no longer be created at all, and the Workers Free plan has only ever supported
# the SQLite backend. It is also what makes this free — SQLite storage is not
# billed on Free.
[exports.BoardRoomObject]
type = "durable-object"
storage = "sqlite"

# The day's AI runs (ADR 0018): one object, so a reservation cannot be raced.
[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuotaObject"

[exports.AiQuotaObject]
type = "durable-object"
storage = "sqlite"

# AI clustering (ADR 0018). The Claude key is a SECRET, never a variable here:
#   wrangler secret put ANTHROPIC_API_KEY
# Until it is set, the route says AI is not set up. The limits are runs per
# signed-in person per day, and for everybody.
#
# The Supabase project is the one the browser signs in with — the same PUBLIC
# values as apps/web/.env, held equal by deploy-config.test.ts. Here and not
# in the Cloudflare dashboard: every deploy replaces the dashboard's plain
# variables with this file's, so a value set there lasts until the next merge.
# (Secrets are different: `wrangler secret put` survives deploys.)
[vars]
AI_DAILY_LIMIT = "20"
AI_GLOBAL_DAILY_LIMIT = "1000"
SUPABASE_URL = "https://nayxpmxpornsjmmmedmh.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_B5U44eQkoeAl8-MfrMG_zQ_cIVbQr2O"

# Where a board's images live.
#
# Outside the Durable Object's storage on purpose: that storage is the board's
# document and its update log, and putting megabytes of photograph beside them
# would be paid for on every snapshot and every compaction — for bytes nothing
# reading the board needs.
#
# R2 has no egress charge, which is the property that matters here: an image is
# written once and read by everyone who opens the board, for as long as it
# exists.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "openframe-assets"

# The session music: CC0 tracks, the same for every board, served publicly by
# this Worker at /music (ADR 0017). Its own bucket, so a board's deletion can
# never reach it and nothing in it is anybody's data. What may be served is
# `src/library/catalogue.json`, not whatever the bucket holds; tracks are put
# here by `tools/audio/upload-tracks.mjs`, which checks each against it.
[[r2_buckets]]
binding = "LIBRARY"
bucket_name = "openframe-library"
