name: Playwright browsers
description: >-
  Installs Playwright's browsers, from a cache keyed on the Playwright version
  actually installed and on which browsers, so each is downloaded once per
  upgrade rather than once per job.

inputs:
  browsers:
    description: Space-separated browsers to install (chromium, firefox, webkit).
    required: false
    default: chromium

runs:
  using: composite
  steps:
    # The version the lockfile resolved, not the range in package.json: a cache
    # keyed on `^1.63.0` would serve an old browser to a newer Playwright that
    # refuses to drive it.
    - id: version
      shell: bash
      run: echo "version=$(pnpm --filter @openframe/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Keyed on the browser list too: a job that needs WebKit must not be handed
    # a cache that only ever held Chromium and then find nothing to launch.
    - id: key
      shell: bash
      run: echo "browsers=$(echo '${{ inputs.browsers }}' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ steps.key.outputs.browsers }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @openframe/web exec playwright install --with-deps ${{ inputs.browsers }}

    # The browsers are cached; the system libraries they link against are not,
    # because they live outside the cached directory.
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter @openframe/web exec playwright install-deps ${{ inputs.browsers }}
