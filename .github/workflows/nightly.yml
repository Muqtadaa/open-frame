name: Nightly

# The whole functional suite in every engine. Every PR already runs it in
# Chromium and the @smoke subset in Firefox and WebKit; this is where the
# rest of the suite meets the other two. A failed scheduled run emails the
# repository's owner.
on:
  schedule:
    # 03:17 UTC, off the hour, when scheduled runs are least likely to be
    # delayed.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end, ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      # One engine's failures must not cancel, or hide, another's.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright
        with:
          browsers: ${{ matrix.browser }}

      - name: Run the end-to-end suite
        run: pnpm --filter @openframe/web exec playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.browser }}
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright

      - name: Generate the benchmark boards
        run: pnpm bench:fixtures

      # The cost of one pass, measured directly: frame time is capped at the
      # refresh rate and only moves once the budget is already blown (rule 10).
      - name: Cull and relation lookups
        run: pnpm bench:cull --json bench-results/cull.json

      - name: An agent peer's reads and writes
        run: pnpm bench:mcp --json bench-results/mcp.json

      # Asserts that DOM nodes track what is on screen; its load and pan
      # times are recorded as the trend, not budgeted.
      - name: Renderer scaling probe
        run: pnpm test:bench
        env:
          OPENFRAME_BENCH_JSON: ${{ github.workspace }}/bench-results/renderer.json

      # What each route makes a browser download first. `pnpm verify` holds
      # these on every change; measured here too, because a budget nothing
      # measured fails (rule 10) — and these three failed the nightly from the
      # day they were added (#94) until this step.
      - name: First-load bundle sizes
        run: |
          pnpm build
          pnpm bench:bundle --json bench-results/bundle.json

      - name: Hold the numbers to their budgets
        if: ${{ !cancelled() }}
        run: pnpm bench:check bench-results/*.json

      # Each night's numbers, kept: the trend is the series of these.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-results
          path: bench-results/
          retention-days: 90
          if-no-files-found: ignore
