name: CI

# ONE run per push, and its jobs ONE AT A TIME.
#
# A push to a PR branch used to start two runs — the branch's `push` and the
# PR's `pull_request` — four jobs each, eight at once. Runners were not
# always there for eight, and jobs sat queued until they were cancelled
# without running a step: red checks with no failing test. So PR branches are
# tested by `pull_request` alone, `main` by its push, and the jobs follow one
# another (`needs`). Each still runs when the one before it failed
# (`!cancelled()`), so a red typecheck never hides what end-to-end would say.
# A full run takes the sum of its jobs, about 25 minutes, not the longest.
on:
  push:
    branches: [main]
  pull_request:

# One run per PR at a time: a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, boundaries, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First because it is the cheapest, and the steps below are `pnpm verify`
      # in the same order: a job that checked less than the local command
      # would pass a push the command refuses.
      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The architectural boundaries, enforced. A failure here means the
      # dependency direction in docs/architecture/ has been violated.
      - name: Architectural boundaries
        run: pnpm depcruise

      - name: Unit and integration tests
        run: pnpm test

      # Generates a small board through the fixture generator, so a change to
      # the document shape that breaks `pnpm bench:fixtures` fails here rather
      # than the next time somebody measures.
      - name: Benchmark fixture smoke
        run: pnpm bench:smoke

      # The agent-peer benchmark on a small board, so the script the nightly
      # budgets depend on cannot rot between nights. `pnpm verify` ran it;
      # this job did not.
      - name: MCP benchmark smoke
        run: pnpm bench:mcp:smoke

      # The budget judge's own tests: a budget nothing measured must fail.
      - name: Tooling tests
        run: pnpm test:tools

      - name: Build
        run: pnpm build

  rooms:
    name: Shared boards, against a real Durable Object
    needs: e2e-browsers
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/playwright

      # Boots a real workerd with a real SQLite-backed Durable Object and drives
      # two browsers at it. Separate from the `e2e` job because it needs a
      # server, and `pnpm test:e2e` has to stay runnable from a clean checkout
      # with no account anywhere.
      - name: Two windows, one board
        run: pnpm test:rooms

      # Traces are recorded on the first retry, so a failure that passed on its
      # retry — the one worth a look — leaves one here as well.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rooms-test-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-browsers:
    # The core loop in the two other engines. Short on purpose: the whole
    # suite in all three runs nightly (nightly.yml), and a PR only needs to
    # know it has not broken placing, editing, moving or saving in Firefox or
    # Safari's engine.
    name: End-to-end, Firefox and WebKit (smoke)
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright
        with:
          browsers: firefox webkit

      - name: Run the smoke tests in Firefox and WebKit
        run: pnpm test:e2e:smoke

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-browsers
          path: apps/web/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-browsers-test-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
