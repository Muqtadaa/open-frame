name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, boundaries, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First because it is the cheapest, and the steps below are `pnpm verify`
      # in the same order: a job that checked less than the local command
      # would pass a push the command refuses.
      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The architectural boundaries, enforced. A failure here means the
      # dependency direction in docs/architecture/ has been violated.
      - name: Architectural boundaries
        run: pnpm depcruise

      - name: Unit and integration tests
        run: pnpm test

      # Generates a small board through the fixture generator, so a change to
      # the document shape that breaks `pnpm bench:fixtures` fails here rather
      # than the next time somebody measures.
      - name: Benchmark fixture smoke
        run: pnpm bench:smoke

      - name: Build
        run: pnpm build

  rooms:
    name: Shared boards, against a real Durable Object
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @openframe/web exec playwright install --with-deps chromium

      # Boots a real workerd with a real SQLite-backed Durable Object and drives
      # two browsers at it. Separate from the `e2e` job because it needs a
      # server, and `pnpm test:e2e` has to stay runnable from a clean checkout
      # with no account anywhere.
      - name: Two windows, one board
        run: pnpm test:rooms

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @openframe/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
